packages:
  - 'apps/*'
  - 'packages/*'

# node-linker hoisted é obrigatório (React Native/Metro). No pnpm 10+ essa
# configuração vive aqui, não no .npmrc.
nodeLinker: hoisted
shamefullyHoist: true
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18
  - expo-image-picker@57.0.18
